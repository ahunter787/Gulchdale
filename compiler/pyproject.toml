[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "gulchdale-compiler"
version = "2.0.0"
description = "Compile the Gulchdale CubeCobra list into a Draftmancer environment"
requires-python = ">=3.12"
dependencies = [
    "PyYAML==6.0.3",
    "requests==2.32.5",
]

[project.optional-dependencies]
dev = [
    "mypy==1.18.2",
    "pytest==8.4.2",
    "ruff==0.13.2",
    "types-PyYAML==6.0.12.20250915",
    "types-requests==2.32.4.20250913",
]

[project.scripts]
gulchdale-compiler = "gulchdale_compiler.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["gulchdale_compiler*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
