        backdrop: /img/gulchdale-landing.jpg
        lobby_backdrop: /img/gulchdale-campfire.webp
        seated_traveler_silhouette: /img/gulchdale-traveler-seated.webp
        seat_traveler_silhouettes:
            - /img/gulchdale-traveler-1.webp
