services:
    gulchdale:
        build:
            context: .
        container_name: gulchdale
        environment:
            NODE_ENV: production
            PERSISTENCE_LOCAL_PATH: /app/state
            PORT: 3000
        ports:
            - "${GULCHDALE_PORT:-43721}:8080"
        volumes:
            - gulchdale-state:/app/state
        restart: unless-stopped
        stop_grace_period: 40s
        healthcheck:
            test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/healthz"]
            interval: 15s
            timeout: 5s
            retries: 5
            start_period: 30s

volumes:
    gulchdale-state:
