name: Server Test

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    server:
        runs-on: ubuntu-latest

        strategy:
            matrix:
                node-version: [22.x]

        env:
            PERSISTENCE_LOCAL_PATH: .

        steps:
            - uses: actions/checkout@v4
            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: "npm"
            - run: npm ci
            - run: npm run build-server
            - run: mkdir tmp # For simulating server restarts
            - name: Verify production dependency tree
              run: npm audit --omit=dev --audit-level=high
            - name: Run Gulchdale unit and control tests
              run: npm run test-gulchdale
            - run: npm run test-gulchdale-acceptance
            - name: Offline foundation and runtime isolation
              run: npm run test-foundation
            - name: Offline candidate research workbench (mocked external API)
              run: npm run test-research
            - name: Application DB migrations and immutable release gates
              run: node scripts/test-foundation-db.mjs

    docker:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4
            - name: Build production Docker image
              run: docker build --tag gulchdale-ci .
