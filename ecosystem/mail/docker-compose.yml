# Mailpit — the single local SMTP sink for this project's development ecosystem.
#
#   project: <PROJECT_SLUG>-infra
#   UI:      http://<ECOSYSTEM_HOST>:<MAILPIT_HTTP_PORT>
#   SMTP:    mailpit:1025     (from any container on the shared network)
#
# Plane and Outline both deliver here, so invitations, password resets and
# Outline's magic links are visible in one place while there is no real mail
# server. Its database is on a named volume so a link survives a restart.
#
# Tooling, not the application: the application's own email is whatever its
# settings say, and pointing it at this sink is optional (see ../README.md).

name: ${MAIL_COMPOSE_PROJECT:-mailpit}

services:
  mailpit:
    image: axllent/mailpit:${MAILPIT_VERSION:-v1.31.4}
    container_name: ${MAILPIT_CONTAINER:-mailpit}
    restart: unless-stopped
    environment:
      # Persist messages instead of keeping them in memory.
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: ${MAILPIT_MAX_MESSAGES:-500}
      # Accept any credentials over plain SMTP: Plane's SMTP form expects a
      # username/password even when the sink does not care, and neither Plane
      # nor Outline is talking to a real mail server here. This listener is on
      # the LAN and inside the Docker network only - it is not a relay.
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_HTTP_PORT:-8025}:8025"
    volumes:
      - mailpit-data:/data
    networks:
      - default
      - shared

volumes:
  mailpit-data:

networks:
  # Created once by `make network` and shared with this project's Plane and
  # Outline projects, so all three can resolve each other by service name.
  shared:
    external: true
    name: ${SHARED_NETWORK}
